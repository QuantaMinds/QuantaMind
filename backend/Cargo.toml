[package]
name = "quantamind"
version = "0.2.4"
description = "QuantaMind — local LLM workspace"
authors = ["quantamind-dev"]
repository = "https://github.com/QuantaMinds/QuantaMind"
edition = "2021"
# Two binaries live on this crate (the Tauri app `quantamind` + the headless `qm`
# CLI), so a bare `cargo run` — which `tauri dev` invokes without `--bin` — would be
# ambiguous. Pin the app as the default so `tauri dev`/`tauri build` just work.
default-run = "quantamind"

[lib]
name = "quantamind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The headless `qm` CLI — a thin bin on the existing crate (ADR 0001: single crate,
# no workspace). Shares the eval/inference engine verbatim via `quantamind_lib`.
# Builds lean with `--no-default-features` (no Tauri/GUI deps) so release
# binaries run on servers without webkit/GTK — see the `gui` feature below.
[[bin]]
name = "qm"
path = "src/bin/qm/main.rs"

# The desktop app. `required-features = ["gui"]` makes cargo skip this bin
# entirely in a `--no-default-features` (headless CLI) build.
[[bin]]
name = "quantamind"
path = "src/main.rs"
required-features = ["gui"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[features]
# The desktop app (Tauri + webview + audio capture). ON by default so
# `pnpm tauri dev` / `cargo build` behave exactly as before. The headless `qm`
# CLI is built with `--no-default-features`, which drops the entire GUI
# dependency tree (webkit/GTK/ALSA on Linux) — the seam release binaries ship
# through. GUI-only modules are gated with `#[cfg(feature = "gui")]`.
default = ["gui"]
gui = [
  "dep:tauri",
  "dep:tauri-plugin-dialog",
  "dep:tauri-plugin-process",
  "dep:tauri-plugin-shell",
  "dep:tauri-plugin-updater",
  "dep:tauri-build",
  # Audio capture/decode + GPU probe — used only by GUI-gated modules; keeping
  # them out of the lean build removes the Linux ALSA build-time dependency.
  "dep:cpal",
  "dep:hound",
  "dep:rubato",
  "dep:symphonia",
  "dep:webrtc-vad",
  "dep:metal",
]
# Enterprise/air-gapped build: compile OUT the entire publish/auth surface
# (commands/publish/{auth,preview_cmd,publish_cmd,cohort}). The offline share
# export (commands/publish/export_cmd) stays IN every build.
enterprise = []

[dependencies]
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
# rustls instead of the platform TLS: no OpenSSL system dependency (the lean CLI
# binary must run on bare servers/containers) and a path to static musl builds.
# `rustls-tls-native-roots` keeps the OS trust store, so corporate/custom CAs
# that worked with native TLS keep working.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "fs", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.32", default-features = false, features = ["disk", "system"] }
sha2 = "0.10"
bytes = "1"
# Publish auth (compiled out of enterprise builds): OS secure store for the
# refresh token. Native backends only — Linux without a secret service falls
# back to an in-memory session token (see commands/publish/auth.rs).
keyring = { version = "3", features = ["apple-native", "windows-native"] }
# PKCE S256 challenge encoding (publish auth; out of enterprise builds).
base64 = "0.22"
hound = { version = "3", optional = true }
rubato = { version = "0.16", optional = true }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "pcm", "wav"], optional = true }
cpal = { version = "0.15", optional = true }
# Independent, deterministic (non-ML) voice-activity detection for the STT
# silence-hallucination metric — never the model under test (anti-circularity).
webrtc-vad = { version = "0.4", optional = true }
# Per-user data / config directory resolution (platform::user_dirs) — resolves
# to %LOCALAPPDATA%\QuantaMind on Windows, ~/.quantamind on Unix.
dirs = "6"
# Arg parsing for the headless `qm` CLI bin (env feature backs --base/--model
# reading QM_BASE/QM_MODEL). See docs/process.md#tech-stack.
clap = { version = "4", features = ["derive", "env"] }

# Windows-only: process-group signaling for graceful sidecar stop (R1) and
# TerminateProcess for hard stop. Aligned with the version already resolved in
# the dep graph (tauri pulls it in).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }

# macOS-only: read the GPU's `recommendedMaxWorkingSetSize` (the Metal wired-memory
# limit — the real cap on how much unified memory the GPU can hold, ~66-75% of RAM).
# The context-ceiling meters budget against THIS, not total RAM, so "fits in memory"
# reflects what actually fits on the GPU.
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33", optional = true }

[dev-dependencies]
mockito = "1"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
