name: Release

# Build signed updater bundles for macOS, Windows, and Linux on a version
# tag, and attach them to a draft GitHub Release. Set repo secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD (the
# same updater key as the local release flow) so the .sig artifacts and
# latest.json validate against the pubkey baked into tauri.conf.json.

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            args: "--target aarch64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: pnpm --dir=frontend install --frozen-lockfile

      - name: Fetch llama-server sidecar
        run: bash scripts/fetch-llama-server.sh

      # R3 — verify every non-system DLL that llama-server.exe imports actually
      # sits alongside it in backend/binaries/. On a dev box the missing DLLs are
      # silently satisfied from ambient CUDA/MinGW installs; a clean user
      # machine crashes with cryptic 0xC0000135. This CI gate fails the release
      # if any dep is missing, so we never ship a broken .msi.
      - name: R3 DLL co-location check (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe not found under $vsPath" }
          $exe = "backend\binaries\llama-server.exe"
          if (-not (Test-Path $exe)) { throw "backend\binaries\llama-server.exe missing (fetch script failed?)" }
          $output = & $dumpbin.FullName /dependents $exe
          $needed = $output | Select-String -Pattern "^\s+(\S+\.dll)$" | ForEach-Object { $_.Matches[0].Groups[1].Value }
          $bundled = Get-ChildItem "backend\binaries" -Filter "*.dll" -Recurse | ForEach-Object { $_.Name.ToLower() }
          $missing = @()
          foreach ($dep in $needed) {
            $dlow = $dep.ToLower()
            # Skip system DLLs from C:\Windows\System32
            $sys = Test-Path "C:\Windows\System32\$dep"
            if ($sys -or $bundled -contains $dlow) { continue }
            $missing += $dep
          }
          if ($missing.Count -gt 0) {
            Write-Host "== llama-server.exe imports these DLLs that are neither system nor bundled: =="
            $missing | ForEach-Object { Write-Host "  $_" }
            throw "R3 DLL check failed: $($missing -join ', ') must be present in backend\binaries\ or added to the fetch script."
          }
          Write-Host "R3 DLL check passed: all $($needed.Count) non-system DLL imports of llama-server.exe are bundled."

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backend
          tagName: ${{ github.ref_name }}
          releaseName: "QuantaMind ${{ github.ref_name }}"
          releaseBody: "See RELEASE_NOTES.md for what's new."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
