name: docker

# Build + push ghcr.io/quantaminds/qm from a published CLI release's binaries.
# Runs automatically when a `quantamind-v*` release is published (by
# quantamind-release.yml), or manually for a given tag. The binaries are
# DOWNLOADED from the release and attestation-verified — never rebuilt — so the
# image ships exactly what the release ships.
on:
  # Called by quantamind-release.yml after announce (post-announce-jobs) — the
  # release event itself never fires here: a GITHUB_TOKEN-published release
  # doesn't trigger other workflows (recursion guard).
  workflow_call:
    inputs:
      plan:
        description: "dist's release plan (passed by the chained post-announce job; unused — the tag comes from github.ref_name)"
        required: false
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "CLI release tag (e.g. quantamind-v0.2.3)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name || github.ref_name, 'quantamind-v')
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag + version
        id: meta
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name || github.ref_name }}"
          case "$TAG" in quantamind-v*) ;; *) echo "::error::not a CLI tag: $TAG"; exit 1;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#quantamind-v}" >> "$GITHUB_OUTPUT"

      - name: Download + attestation-verify release binaries
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          mkdir -p binaries/amd64 binaries/arm64
          # amd64 = the static musl binary (runs anywhere); arm64 = glibc (distroless/cc provides it).
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            -p 'quantamind-x86_64-unknown-linux-musl.tar.xz' \
            -p 'quantamind-aarch64-unknown-linux-gnu.tar.xz'
          gh attestation verify quantamind-x86_64-unknown-linux-musl.tar.xz --repo "$GITHUB_REPOSITORY"
          gh attestation verify quantamind-aarch64-unknown-linux-gnu.tar.xz --repo "$GITHUB_REPOSITORY"
          tar -xJf quantamind-x86_64-unknown-linux-musl.tar.xz
          tar -xJf quantamind-aarch64-unknown-linux-gnu.tar.xz
          mv quantamind-x86_64-unknown-linux-musl/qm binaries/amd64/qm
          mv quantamind-aarch64-unknown-linux-gnu/qm binaries/arm64/qm
          chmod +x binaries/*/qm

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/quantaminds/qm:${{ steps.meta.outputs.version }}
            ghcr.io/quantaminds/qm:latest

  # Prove the image + the DOCUMENTED host-networking command against a real
  # llama-server listening on the runner's host port — the exact setup a user has.
  smoke:
    needs: build-push
    runs-on: ubuntu-22.04
    steps:
      - name: Start host llama-server (container publishing :8081 on the host)
        run: |
          docker run -d --name llama -p 8081:8081 ghcr.io/ggml-org/llama.cpp:server \
            -hf ggml-org/models:tinyllamas/stories15M-q4_0.gguf --host 0.0.0.0 --port 8081
          for i in $(seq 1 60); do
            curl -fsS localhost:8081/health && break || sleep 2
          done

      - name: Pull image and run the documented commands
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          IMG="ghcr.io/quantaminds/qm:${{ needs.build-push.outputs.version }}"
          docker run --rm "$IMG" --version
          # The doc's networking one-liner. Exit may be nonzero by contract, so
          # gate on the rendered report instead: the llama_cpp line must NOT
          # read unreachable.
          docker run --rm --add-host=host.docker.internal:host-gateway "$IMG" \
            doctor --backend llama_cpp --base http://host.docker.internal:8081 \
            > doctor.out 2>&1 || true
          cat doctor.out
          grep -E '^llama_cpp' doctor.out | grep -v unreachable
