name: CI

# Run the test suites on every branch push and PR so the eval-engine integrity
# guards (reachability / tag-guard / oracle satisfiability) and the rest of the
# suite fire AUTOMATICALLY — not only when someone remembers to run them locally.
# Release builds live in release.yml (tags only); this is the test gate.
#
# Phase 5: promoted to a per-OS matrix so Windows and Linux regressions are
# caught here, not on release day. macOS remains the primary runner; Ubuntu
# needs libwebkit2gtk-*-dev + gtk-3 + patchelf; Windows uses Git Bash for the
# fetch-llama-server.sh sidecar script and VS Build Tools' `dumpbin` for the R3
# DLL check in release.yml.

on:
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}-${{ matrix.os }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Linux needs the Tauri system libs so `cargo test --lib` (which pulls in
      # `tauri` as a regular [dependencies] entry) compiles. macOS + Windows
      # ship the equivalents.
      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # --- Backend: Rust lib tests (the green suite; NOT full `cargo test`, a
      #     pre-existing broken non-lib target blocks that). ---
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.os }}

      - name: cargo test --lib
        working-directory: backend
        run: cargo test --lib

      # --- Backend: architecture guard. The one-way dependency law
      #     (docs/architecture.md#layering) is deterministic and infra-free, so
      #     gate it on every PR. (The folder-size rule lives in a separate target,
      #     folder_taxonomy.rs, which carries known pre-existing debt and is not
      #     gated here yet — see docs/restructure-todo.md.) ---
      - name: cargo test --test layering_guard
        working-directory: backend
        run: cargo test --test layering_guard

      # --- Backend: clippy as an error gate. Surfaces lint warnings in the log
      #     and fails on clippy *errors* (incl. any `unsafe`, denied crate-wide).
      #     Not `-D warnings` yet: ~49 pre-existing warnings are tracked separately
      #     (docs/restructure-todo.md) and would otherwise red-wash the gate. ---
      - name: cargo clippy --lib
        working-directory: backend
        run: cargo clippy --lib

      # --- Frontend: typecheck + vitest. ---
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: vitest run
        working-directory: frontend
        run: pnpm test
