name: CI

# Run the test suites on every branch push and PR so the eval-engine integrity
# guards (reachability / tag-guard / oracle satisfiability) and the rest of the
# suite fire AUTOMATICALLY — not only when someone remembers to run them locally.
# Release builds live in release.yml (tags only); this is the test gate.
#
# Phase 5: promoted to a per-OS matrix so Windows and Linux regressions are
# caught here, not on release day. macOS remains the primary runner; Ubuntu
# needs libwebkit2gtk-*-dev + gtk-3 + patchelf; Windows uses Git Bash for the
# fetch-llama-server.sh sidecar script and VS Build Tools' `dumpbin` for the R3
# DLL check in release.yml.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # Drift-guard for the headless CLI seam (docs/architecture.md#the-gui-feature-seam-headless-cli-build):
  # `qm` must build with NO Tauri system libs installed and must not link
  # gtk/webkit/asound/ssl — the exact promise the release binaries make to
  # servers and CI runners. Runs on the bare ubuntu image: no apt step at all.
  qm-headless:
    runs-on: ubuntu-22.04
    concurrency:
      group: ci-qm-headless-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: qm-headless
      - name: Build lean qm (no default features, no Tauri system deps)
        working-directory: backend
        run: cargo build --release --bin qm --no-default-features
      - name: Assert no GUI/TLS system linkage
        working-directory: backend
        run: |
          ldd target/release/qm
          if ldd target/release/qm | grep -iE 'gtk|webkit|asound|libssl|libcrypto'; then
            echo "::error::lean qm links a GUI/OpenSSL system lib — the gui feature seam regressed"
            exit 1
          fi
      - name: Smoke-run the binary
        working-directory: backend
        run: ./target/release/qm --version
      # Static musl build (feeds the release matrix). rustls + the gated GUI
      # deps make this possible; if a dep regresses musl support this fails loudly.
      - name: Build static musl qm
        working-directory: backend
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          cargo build --release --bin qm --no-default-features --target x86_64-unknown-linux-musl
          file target/x86_64-unknown-linux-musl/release/qm
          ./target/x86_64-unknown-linux-musl/release/qm --version

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    # A newer push to the same branch/PR cancels the older in-flight run.
    # Concurrency lives at the JOB level (not workflow level) because
    # `matrix.os` is only in scope inside a job — a workflow-level
    # `${{ matrix.os }}` is a validation error and fails the run outright
    # ("This run likely failed because of a workflow file issue"). Per-leg
    # groups so a new push cancels each matrix leg independently.
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Linux needs the Tauri system libs so `cargo test --lib` (which pulls in
      # `tauri` as a regular [dependencies] entry) compiles. macOS + Windows
      # ship the equivalents.
      - name: Install Linux Tauri deps
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # --- Backend: Rust lib tests (the green suite; NOT full `cargo test`, a
      #     pre-existing broken non-lib target blocks that). ---
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          key: ${{ matrix.os }}

      - name: cargo test --lib
        working-directory: backend
        run: cargo test --lib

      # --- Backend: architecture guard. The one-way dependency law
      #     (docs/architecture.md#layering) is deterministic and infra-free, so
      #     gate it on every PR. (The folder-size rule lives in a separate target,
      #     folder_taxonomy.rs, which carries known pre-existing debt and is not
      #     gated here yet — see docs/restructure-todo.md.) ---
      - name: cargo test --test layering_guard
        working-directory: backend
        run: cargo test --test layering_guard

      # --- Backend: clippy as an error gate. Surfaces lint warnings in the log
      #     and fails on clippy *errors* (incl. any `unsafe`, denied crate-wide).
      #     Not `-D warnings` yet: ~49 pre-existing warnings are tracked separately
      #     (docs/restructure-todo.md) and would otherwise red-wash the gate. ---
      - name: cargo clippy --lib
        working-directory: backend
        run: cargo clippy --lib

      # --- Frontend: typecheck + vitest. ---
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: tsc --noEmit
        working-directory: frontend
        run: pnpm exec tsc --noEmit
      - name: vitest run
        working-directory: frontend
        run: pnpm test
