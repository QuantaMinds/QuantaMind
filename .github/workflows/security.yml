name: Security

# Supply-chain + secret hygiene, separate from the test gate in ci.yml.
# - secret-scan: gitleaks over the FULL history (catches a committed key/token/path).
# - dependency-audit: cargo audit (Rust) + pnpm audit (frontend) for known-vuln deps.
# - sbom: a CycloneDX Software Bill of Materials for both stacks, uploaded as an artifact.
#
# Runs on PRs, pushes to main, and weekly (so a newly-DISCLOSED advisory against an
# unchanged dependency still surfaces). Kept off every branch push to stay light.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — a secret removed in a later commit still leaked
      # Install the gitleaks binary directly (no org-license gate that the marketplace
      # action imposes). Fails the job on any finding.
      - name: Run gitleaks
        run: |
          VERSION=8.21.2
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  rust-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo audit
        working-directory: backend
        # Report-only for now: the RustSec DB also flags unmaintained-crate advisories that
        # aren't exploitable vulns. Triage, then drop `continue-on-error` to make it blocking.
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

  frontend-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # pnpm 11 ONLY in this job (the rest of CI stays on 9): npm retired the audit
      # endpoints pnpm 9 and 10 call — both now answer `410 Gone` ("use the bulk advisory
      # endpoint"), so `pnpm audit` fails outright on any input and the gate reports a
      # registry outage as a vulnerability. pnpm 11 uses the bulk endpoint. It reads this
      # repo's `lockfileVersion: 9.0` unchanged (verified: `--frozen-lockfile` installs
      # clean and does not rewrite the lock), so pinning it here fixes the gate without
      # touching the build/release path.
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          # 22, not the 20 the other jobs use: pnpm 11 declares `engines.node >= 22.13` and
          # dies on 20 with ERR_UNKNOWN_BUILTIN_MODULE. Scoped to this job, which only
          # installs and audits — it builds and tests nothing, so the toolchain the app is
          # actually built and tested against (Node 20, in ci.yml/release.yml) is unchanged.
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      # BLOCKING: shipped (production) deps must have no high/critical vuln.
      - name: pnpm audit (production, high+)
        working-directory: frontend
        run: pnpm audit --prod --audit-level high
      # REPORT-ONLY: dev-tool advisories (e.g. the test runner) don't ship — surface, don't block.
      - name: pnpm audit (full, report only)
        working-directory: frontend
        continue-on-error: true
        run: pnpm audit

  sbom:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust SBOM (CycloneDX)
        working-directory: backend
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --format json
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend SBOM (CycloneDX)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm dlx @cyclonedx/cyclonedx-npm --output-file sbom.frontend.json || true
      - name: Upload SBOMs
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            backend/**/*.cdx.json
            frontend/sbom.frontend.json
          if-no-files-found: warn
